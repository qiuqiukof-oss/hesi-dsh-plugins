# Hesi 圆桌工作流 · DeepSeek Harness 插件
# 组合示例：把下面的条目加到你的 cordis.yml（或在 headless-agent/cordis.yml 副本后追加）
#
# 注意：
#  - 包名使用第三方作用域 @hesi/*（DSH 官方包为 @deepseek-ai/dsh-*）。
#  - 本插件注册 ctx.hesiRoundtable 服务 + `roundtable` 工具。
#  - 圆桌席位通过 ctx.agents.create 原生多智能体机制拉起，不替换 agent-loop。
#  - 需先装配 agent-loop / tools / system-prompt / llm 等基础插件（见 examples/headless-agent/cordis.yml）。

- name: '@hesi/dsh-roundtable'
  config:
    # 每阶段默认轮数（可选）
    roundsPerPhase: 1
    # 默认席位人设（可选；不填则由调用方通过工具参数传入）
    seats:
      - id: 'engineer'
        persona: '你是一名资深工程师，关注可行性与实现成本。'
      - id: 'pm'
        persona: '你是一名产品经理，关注用户价值与范围。'
      - id: 'skeptic'
        persona: '你是一名持怀疑态度的评审，专门挑风险与漏洞。'
